            m0_intro: `
                <div class="fade-in">

                        <span class="text-sky-500 font-mono tracking-widest text-sm uppercase">Module 0</span>
                        <h2 class="text-5xl font-extrabold text-white mt-2 mb-6">Fundamentals of Autonomous sUAS</h2>
                        <p class="text-xl text-slate-400 max-w-3xl mx-auto">Before writing a single line of code or soldering a carrier board, engineers must understand the theoretical framework of unmanned autonomy and the strict constraints of the environment.</p>
                    </div>

                    <h3>0.1 The Evolution of sUAS Autonomy</h3>
                    <p>Historically, Unmanned Aircraft Systems (UAS) were purely remote-controlled vehicles. The operator provided all cognitive input—stabilization, navigation, and targeting. The introduction of MEMS (Micro-Electro-Mechanical Systems) IMUs allowed for auto-leveling. The integration of GPS allowed for waypoint navigation.</p>
                    <p>However, modern mission requirements—such as navigating inside collapsed buildings, flying under dense forest canopies, or operating in electronic warfare environments where GPS is actively jammed—render traditional navigation useless. <strong>Edge AI is not a luxury feature; it is an operational mandate for survivability and mission success in GPS-denied environments.</strong></p>
                    
                    <div class="interactive-panel">
                        <h4 class="mt-0 border-none">Levels of Aerial Autonomy (AL0 to AL5)</h4>
                        <p class="text-sm mb-6">Similar to self-driving cars, drone autonomy is categorized into levels. Edge AI primarily enables AL3 through AL5.</p>
                        <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                            <div class="bg-slate-800 p-4 rounded border-l-4 border-slate-600">
                                <strong class="text-white">AL0 - AL1: Manual & Assisted</strong><br>
                                <span class="text-xs text-slate-400">Direct RC control. Basic attitude stabilization (PID loops). Operator does everything.</span>
                            </div>
                            <div class="bg-slate-800 p-4 rounded border-l-4 border-amber-500">
                                <strong class="text-white">AL2: Partial Autonomy</strong><br>
                                <span class="text-xs text-slate-400">GPS waypoint following. Pre-programmed routes. Fails if GPS is lost.</span>
                            </div>
                            <div class="bg-slate-800 p-4 rounded border-l-4 border-sky-500">

                            </div>
                            <div class="bg-slate-800 p-4 rounded border-l-4 border-emerald-500">
                                <strong class="text-white">AL4 - AL5: High & Full Autonomy</strong><br>
                                <span class="text-xs text-slate-400">Semantic understanding. Drone is given a high-level goal ("Find the red truck in sector 4"). It plans its own route, searches, adapts to weather, and executes without any comms link.</span>
                            </div>
                        </div>
                    </div>

                    <h3>0.2 The Aerial OODA Loop</h3>
                    <p>The OODA loop (Observe, Orient, Decide, Act), originally developed by military strategist John Boyd, is the perfect architectural model for an AI drone software stack. Every millisecond, the drone's processors must execute this loop.</p>
                    <ul class="space-y-4">
                        <li><strong>Observe:</strong> High-bandwidth data ingestion. Stereo cameras capture 60 FPS uncompressed video. LiDAR spins at 10Hz. The IMU samples at 400Hz. This requires immense data bus bandwidth (MIPI CSI, PCIe).</li>
                        <li><strong>Orient:</strong> The heaviest computational load. The drone runs VSLAM (Visual Simultaneous Localization and Mapping) to figure out <em>where</em> it is. It runs Object Detection (e.g., YOLO) to figure out <em>what</em> is around it.</li>
                        <li><strong>Decide:</strong> Path planning algorithms (like A* or RRT*) and behavioral state machines evaluate the oriented data against the mission parameters to generate a safe trajectory vector.</li>
                        <li><strong>Act:</strong> The high-level PC translates the trajectory into a MAVLink command, sends it to the real-time Flight Controller, which calculates the complex motor mixing matrix and sends PWM signals to the ESCs.</li>
                    </ul>

                    <h3>0.3 The Edge vs. Cloud Paradigm</h3>
                    <p>Why put a heavy, hot, power-hungry GPU on a flying battery? Why not stream the video to the cloud, process it on an AWS server, and send commands back? The answer is <strong>Latency and Reliability</strong>.</p>
                    <div class="math-block">
                        Total Cloud Loop Latency = t_encode + t_tx + t_network + t_inference + t_rx + t_decode<br><br>
                        Example:<br>
                        Video Encode (H.265): 20ms<br>
                        4G/5G Uplink: 40ms<br>
                        Cloud Inference (A100 GPU): 10ms<br>
                        Command Downlink: 30ms<br>
                        Total Latency: ~100ms
                    </div>
                    <p>At 15 m/s (33 mph), a drone travels 1.5 meters in 100ms. If an obstacle appears, by the time the cloud tells the drone to brake, it has already crashed. Furthermore, RF links are easily jammed or blocked by buildings. <strong>Edge AI ensures the OODA loop remains closed and deterministic, operating purely on silicon physics rather than network luck.</strong></p>
                </div>
            `,

                    <p>But we must also add the electrical power consumed by the AI processor itself (e.g., 20W). Therefore, total power jumps from 80.5W to 125.4W. If your battery holds 100 Wh of energy, your flight time drops from 74 minutes to 47 minutes. <strong>This is the brutal reality of SWaP.</strong></p>

                    <h3>1.2 Lithium Battery Discharge & Brownouts</h3>
                    <p>Drones utilize Lithium Polymer (LiPo) or Lithium-Ion (Li-ion, e.g., 21700 cells) batteries. Their voltage is not constant. A 6-cell (6S) LiPo drops from 25.2V fully charged to ~19.8V when empty.</p>
                    <p>AI processors require highly stable 5V or 12V rails. If the drone performs an aggressive maneuver (e.g., full throttle punch-out), the motors can draw 150 Amps instantly. Due to internal battery resistance ($V_{drop} = I * R_{internal}$), the battery voltage can briefly sag by several volts. This is called a "Brownout".</p>

                    </div>
                    <p><strong>Engineering Solution:</strong> Engineers implement Buck-Boost regulators with massive Low-ESR (Equivalent Series Resistance) capacitor banks (e.g., 2200µF, 35V Rubycon ZLH series) placed immediately before the AI processor to act as a localized power reserve during transient load spikes.</p>

                    <h3>1.3 Thermal Dynamics: Forced vs Natural Convection</h3>
                    <p>We established the base Thermal Resistance equation. In an enclosed drone, natural convection (air rising as it heats) is insufficient for 15W+ processors. Engineers must utilize forced convection, but adding a fan introduces a moving part that can fail.</p>
                    
                    <div class="interactive-panel">
                        <h4 class="mt-0 text-sky-400 border-none">Advanced Thermal Estimator</h4>

                            </div>

                                <label class="text-slate-400 block mb-1">Internal Ambient Temp (°C): <span id="amb-val2" class="text-white font-bold">45°C</span></label>
                                <input type="range" id="amb-input2" min="20" max="75" value="45" class="w-full accent-sky-500" oninput="runThermalSim()">
                            </div>
                            <div class="md:col-span-2">
                                <label class="text-slate-400 block mb-1">Airflow Velocity over Heatsink (m/s): <span id="vel-val" class="text-white font-bold">1.0 m/s</span></label>

                        <div class="mt-6 p-6 bg-slate-900 rounded border border-slate-700 text-center">
                            <p class="text-slate-400 text-xs uppercase tracking-wider mb-2">Estimated Junction Temperature (Tj)</p>
                            <div id="tj-result" class="text-4xl font-mono text-emerald-400 font-bold tracking-tight">65 °C</div>
                            <div id="tj-status" class="mt-2 text-sm font-bold text-emerald-500">SAFE OPERATING ZONE</div>
                            <p class="text-xs text-slate-500 mt-4 max-w-lg mx-auto">Calculated assuming a standard aluminum finned heatsink (Base Rθ ≈ 2.5 °C/W in still air). Convective heat transfer coefficient (h) scales with √Velocity, reducing Rθ.</p>
                        </div>
                    </div>

                    <h2>AI Targeting & Kinematics</h2>
                    <p>Detecting an object in a frame is merely computer vision. Tracking it through 3D space, predicting its movement, and controlling a drone to intercept it is autonomous robotics.</p>

                    <h3>6.1 Multi-Object Tracking (DeepSORT)</h3>
                    <p>YOLO only tells you "There is a car here in this specific frame." It does not know if it's the same car from the previous frame. DeepSORT (Simple Online and Realtime Tracking with a Deep Association Metric) assigns persistent IDs to objects.</p>
                    
                    <ul class="space-y-4">
                        <li><strong>State Estimation (Kalman Filter):</strong> DeepSORT maintains a mathematical state for every tracked object: $(u, v, \gamma, h, \dot{x}, \dot{y}, \dot{\gamma}, \dot{h})$ representing bounding box center, aspect ratio, height, and their velocities. The Kalman filter predicts where the box will be in the next frame.</li>
                        <li><strong>Data Association (Hungarian Algorithm):</strong> When the next frame arrives with new YOLO detections, the algorithm must match the new detections to the predicted Kalman tracks. It computes a cost matrix based on:
                            <ul class="list-disc pl-5 mt-2 text-sm text-slate-400">
                                <li><em>Mahalanobis Distance:</em> Geometric distance between predicted box and new detection.</li>
                                <li><em>Cosine Distance:</em> Visual appearance difference (using a secondary CNN to extract visual features, ensuring we don't swap IDs if two identical cars pass each other).</li>
                            </ul>
                        </li>
                    </ul>

                    <p>Once the target pixel coordinates are known and stabilized by DeepSORT, the drone must physically move to keep the target in the center of the frame (Pixel coordinate $u_{center}, v_{center}$). This is achieved via a PID (Proportional-Integral-Derivative) controller.</p>

                        Error(t) = Target_Pixel_X - Image_Center_X<br><br>
                        Command_Output = (K_p * Error) + (K_i * ∫Error dt) + (K_d * dError/dt)

                <h3 class="mt-0 text-purple-400 border-none mb-2">Phase 4: Airframe Integration</h3>
                <p class="text-slate-300 text-sm mb-4">Mounting the electronics onto the carbon fiber frame.</p>
                <ul class="list-disc pl-5 space-y-2 text-sm text-slate-400 mb-6">
                    <li><strong>Vibration Isolation:</strong> The camera and flight controller must be hard-mounted to each other to maintain Extrinsic calibration, but that entire sub-assembly must be soft-mounted (via silicone dampeners) to the frame to prevent high-frequency motor vibrations from destroying the IMU data.</li>
                    <li><strong>EMI Shielding:</strong> Wrap the MIPI CSI camera cables in copper foil tape and ground the tape. ESC PWM noise will absolutely corrupt MIPI video signals if unshielded.</li>
                    <li><strong>Thermal:</strong> Mount the Jetson heatsink such that it protrudes into the downward prop-wash of the front rotors for active in-flight cooling.</li>
                </ul>
            `,
            5: `
                <h3 class="mt-0 text-rose-500 border-none mb-2">Phase 5: Tethered Flight Test</h3>
                <p class="text-slate-300 text-sm mb-4">The final validation step before untethered autonomous flight.</p>
                <ul class="list-disc pl-5 space-y-2 text-sm text-slate-400 mb-6">
                    <li>Attach the drone to a heavy ground anchor using a 3-meter slack tether line.</li>
                    <li>Pilot takes off in manual mode and establishes a stable hover.</li>
                    <li>Pilot flips the RC switch to activate "GUIDED" or "OFFBOARD" mode, relinquishing control to the AI Companion Computer.</li>
                    <li>The AI attempts to track a target (e.g., a person walking). If the PID tuning is violently wrong, the drone will jerk, but the physical tether prevents a fly-away. The pilot can instantly switch back to manual mode to recover.</li>
                    <li>Analyze log files (rosbags and .bin logs) to measure CPU load, thermal levels, and target tracking latency during the physical flight.</li>
                </ul>
            `
        };

        // --- INTERACTION LOGIC ---

        function buildNav() {
            const list = document.getElementById('nav-list');
            const mobile = document.getElementById('mobile-nav');
            
            modules.forEach(m => {
                // Desktop
                const li = document.createElement('li');
                li.innerHTML = `<button onclick="loadModule('${m.id}')" id="nav-${m.id}" class="nav-item w-full text-left px-4 py-3 text-sm text-slate-400 hover:text-white hover:bg-[#0f172a] rounded font-medium transition-colors">${m.title}</button>`;
                list.appendChild(li);

                // Mobile
                const opt = document.createElement('option');
                opt.value = m.id;
                opt.text = m.short;
                mobile.appendChild(opt);
            });
        }

        function loadModule(id) {
            document.querySelectorAll('.nav-item').forEach(el => el.classList.remove('active'));
            const activeBtn = document.getElementById(`nav-${id}`);
            if(activeBtn) activeBtn.classList.add('active');

            const mobileSelect = document.getElementById('mobile-nav');
            if(mobileSelect.value !== id) mobileSelect.value = id;

            const container = document.getElementById('content-container');
            container.innerHTML = contentDB[id] || '<p class="text-white">Content loading error.</p>';
            
            document.getElementById('main-scroll').scrollTop = 0;

            // Module Specific Initializations
            if(id === 'm1_physics') runThermalSim();
            if(id === 'm2_hardware') setTimeout(initHardwareChart, 100);
            if(id === 'm7_swarms') setTimeout(initSwarm, 100);
            if(id === 'm8_workflow') updateWorkflow(null, 1);

            if(window.Prism) setTimeout(() => Prism.highlightAll(), 50);
            updateProgress();
        }

        function updateProgress() {
            const scroll = document.getElementById('main-scroll');
            const maxScroll = scroll.scrollHeight - scroll.clientHeight;
            // Simple progress based on which module we are on (just for visual effect)
            const activeId = document.querySelector('.nav-item.active')?.id.replace('nav-', '');
            const idx = modules.findIndex(m => m.id === activeId);
            const percent = ((idx + 1) / modules.length) * 100;
            document.getElementById('progress-bar').style.width = percent + '%';
        }

        // Module 1: Thermal Calculator Logic
        window.runThermalSim = function() {
            const pwr = document.getElementById('pwr-input2').value;
            const amb = document.getElementById('amb-input2').value;
            const vel = document.getElementById('vel-input').value;
            
            document.getElementById('pwr-val2').innerText = pwr + " W";
            document.getElementById('amb-val2').innerText = amb + " °C";
            document.getElementById('vel-val').innerText = vel + " m/s";
            
            // Simplified Heat Transfer Math
            // Base thermal resistance (still air)
            let R_th = 2.5; 
            // Convection scaling: Airflow reduces resistance (roughly 1 / sqrt(v))
            if (vel > 0) {
                R_th = R_th / (1 + 1.5 * Math.sqrt(vel)); 
            }
            
            const tj = parseFloat(amb) + (parseFloat(pwr) * R_th);
            
            const tjEl = document.getElementById('tj-result');
            const statEl = document.getElementById('tj-status');
            
            tjEl.innerText = tj.toFixed(1) + " °C";
            
            if(tj > 85) {
                tjEl.className = "text-4xl font-mono text-rose-500 font-bold tracking-tight";
                statEl.className = "mt-2 text-sm font-bold text-rose-500 animate-pulse";
                statEl.innerText = "CRITICAL: THERMAL THROTTLING / SHUTDOWN";
            } else if(tj > 70) {
                tjEl.className = "text-4xl font-mono text-amber-400 font-bold tracking-tight";
                statEl.className = "mt-2 text-sm font-bold text-amber-400";
                statEl.innerText = "WARNING: REDUCED LIFESPAN";
            } else {
                tjEl.className = "text-4xl font-mono text-emerald-400 font-bold tracking-tight";
                statEl.className = "mt-2 text-sm font-bold text-emerald-500";
                statEl.innerText = "SAFE OPERATING ZONE";
            }
        }

        // Module 8: Workflow Logic
        window.updateWorkflow = function(el, stepNum) {
            if(el) {
                document.querySelectorAll('.workflow-step').forEach(e => e.classList.remove('active'));
                el.classList.add('active');
            }
            const contentPanel = document.getElementById('wf-content');
            if(contentPanel) {
                contentPanel.classList.remove('fade-in');
                void contentPanel.offsetWidth; // trigger reflow
                contentPanel.innerHTML = workflowContent[stepNum];
                contentPanel.classList.add('fade-in');
            }
        }

        // Module 2: Hardware Chart
        let hwChartInst = null;
        function initHardwareChart() {
            const ctx = document.getElementById('hwChartMain');
            if(!ctx) return;
            if(hwChartInst) hwChartInst.destroy();

            Chart.defaults.color = '#94a3b8';
            Chart.defaults.font.family = "'Fira Code', monospace";

            const data = [
                {x: 600, y: 100, r: 25, label: 'Jetson Orin NX', cat: 'GPU', color: 'rgba(16, 185, 129, 0.7)'},
                {x: 2000, y: 275, r: 40, label: 'Jetson AGX Orin', cat: 'GPU', color: 'rgba(16, 185, 129, 0.7)'},
                {x: 150, y: 26, r: 15, label: 'Hailo-8', cat: 'NPU', color: 'rgba(168, 85, 247, 0.7)'},
                {x: 130, y: 13, r: 12, label: 'RPi 5 + Hailo-8L', cat: 'Hybrid', color: 'rgba(236, 72, 153, 0.7)'},
                {x: 120, y: 6, r: 10, label: 'Orange Pi 5 (RK3588)', cat: 'SoC', color: 'rgba(245, 158, 11, 0.7)'},
                {x: 100, y: 4, r: 8, label: 'Coral Edge TPU', cat: 'NPU', color: 'rgba(168, 85, 247, 0.7)'},
                {x: 450, y: 15, r: 15, label: 'Qualcomm RB5', cat: 'DSP', color: 'rgba(14, 165, 233, 0.7)'},
                {x: 400, y: 10, r: 16, label: 'AMD Kria KR260', cat: 'FPGA', color: 'rgba(56, 189, 248, 0.7)'}
            ];

            hwChartInst = new Chart(ctx, {
                type: 'bubble',
                data: {
                    datasets: [{
                        label: 'Edge AI Hardware',
                        data: data,
                        backgroundColor: data.map(d => d.color),
                        borderColor: 'rgba(255,255,255,0.2)',
                        borderWidth: 1
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    scales: {
                        x: {
                            type: 'logarithmic',
                            title: { display: true, text: 'Estimated Cost ($) - Log Scale', color: '#f8fafc', font: {size: 14} },
                            grid: { color: '#1e293b' }
                        },
                        y: {
                            type: 'logarithmic',
                            title: { display: true, text: 'AI Performance (TOPS) - Log Scale', color: '#f8fafc', font: {size: 14} },
                            grid: { color: '#1e293b' },
                            min: 1
                        }
                    },
                    plugins: {
                        legend: { display: false },
                        tooltip: {
                            backgroundColor: '#0f172a',
                            titleFont: { size: 14, family: 'Inter', weight: 'bold' },
                            bodyFont: { size: 13, family: 'Fira Code' },
                            padding: 12,
                            borderColor: '#38bdf8',
                            borderWidth: 1,
                            callbacks: {
                                label: function(ctx) {
                                    const d = ctx.raw;
                                    return [
                                        `Hardware: ${d.label}`,
                                        `Architecture: ${d.cat}`,
                                        `Cost: $${d.x}`,
                                        `Performance: ${d.y} TOPS`
                                    ];
                                }
                            }
                        }
                    }
                }
            });
        }

        // Module 7: Canvas Boids Simulation
        let animationId;
        window.initSwarm = function() {
            const canvas = document.getElementById('swarmCanvas');
            if(!canvas) return;
            const ctx = canvas.getContext('2d');
            
            // Adjust canvas to match container width
            canvas.width = canvas.parentElement.clientWidth - 64; // rough padding
            canvas.height = 400;

            const boids = [];
            const numBoids = 60;
            const visualRange = 60;

            class Boid {
                constructor() {
                    this.x = Math.random() * canvas.width;
                    this.y = Math.random() * canvas.height;
                    this.dx = (Math.random() - 0.5) * 4;
                    this.dy = (Math.random() - 0.5) * 4;
                }

                draw() {
                    const angle = Math.atan2(this.dy, this.dx);
                    ctx.translate(this.x, this.y);
                    ctx.rotate(angle);
                    ctx.translate(-this.x, -this.y);
                    
                    // Draw drone triangle
                    ctx.fillStyle = '#0ea5e9';
                    ctx.beginPath();
                    ctx.moveTo(this.x + 8, this.y);
                    ctx.lineTo(this.x - 6, this.y + 5);
                    ctx.lineTo(this.x - 6, this.y - 5);
                    ctx.fill();
                    
                    // reset transform
                    ctx.setTransform(1, 0, 0, 1, 0, 0);
                }

                update(boids) {
                    let sepW = parseFloat(document.getElementById('sep-slider').value);
                    let aliW = parseFloat(document.getElementById('ali-slider').value);
                    let cohW = parseFloat(document.getElementById('coh-slider').value);

                    let centerX = 0, centerY = 0;
                    let avgDx = 0, avgDy = 0;
                    let moveX = 0, moveY = 0;
                    let numNeighbors = 0;

                    for (let other of boids) {
                        if (other === this) continue;
                        const dist = Math.hypot(this.x - other.x, this.y - other.y);
                        if (dist < visualRange) {
                            // Cohesion
                            centerX += other.x;
                            centerY += other.y;
                            // Alignment
                            avgDx += other.dx;
                            avgDy += other.dy;
                            numNeighbors += 1;
                            
                            // Separation
                            if (dist < 20) {
                                moveX += this.x - other.x;
                                moveY += this.y - other.y;
                            }
                        }
                    }

                    if (numNeighbors > 0) {
                        centerX = centerX / numNeighbors;
                        centerY = centerY / numNeighbors;
                        
                        avgDx = avgDx / numNeighbors;
                        avgDy = avgDy / numNeighbors;

                        // Apply weights
                        this.dx += (centerX - this.x) * (0.005 * cohW);
                        this.dy += (centerY - this.y) * (0.005 * cohW);
                        
                        this.dx += (avgDx - this.dx) * (0.05 * aliW);
                        this.dy += (avgDy - this.dy) * (0.05 * aliW);
                    }
                    
                    this.dx += moveX * (0.05 * sepW);
                    this.dy += moveY * (0.05 * sepW);

                    // Speed limits
                    const speed = Math.hypot(this.dx, this.dy);
                    const speedLimit = 3;
                    if (speed > speedLimit) {
                        this.dx = (this.dx / speed) * speedLimit;
                        this.dy = (this.dy / speed) * speedLimit;
                    }

                    // Bounds wrapping
                    this.x += this.dx;
                    this.y += this.dy;
                    if(this.x < 0) this.x = canvas.width;
                    if(this.x > canvas.width) this.x = 0;
                    if(this.y < 0) this.y = canvas.height;
                    if(this.y > canvas.height) this.y = 0;
                }
            }

            for(let i=0; i<numBoids; i++) boids.push(new Boid());

            if(animationId) cancelAnimationFrame(animationId);

            function loop() {
                ctx.clearRect(0, 0, canvas.width, canvas.height);
                for (let boid of boids) {
                    boid.update(boids);
                    boid.draw();
                }
                animationId = requestAnimationFrame(loop);
            }
            loop();
        }

        // Init
        document.addEventListener('DOMContentLoaded', () => {
            buildNav();
            loadModule('m0_intro'); // Default landing page
            
            // Handle window resize for canvas
            window.addEventListener('resize', () => {
                if(document.querySelector('.nav-item.active')?.id === 'nav-m7_swarms') {
                    initSwarm();
                }
            });
        });

    </script>
