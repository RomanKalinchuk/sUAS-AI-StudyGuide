<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>sUAS Edge AI & Autonomous Systems: Masterclass</title>
    <link rel="icon" href="images/icon.ico" type="image/x-icon">

    <link rel="stylesheet" href="css/main.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.2/dist/chart.umd.min.js"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/themes/prism-tomorrow.min.css" rel="stylesheet" />
    <script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/prism.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/components/prism-python.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/components/prism-c.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/components/prism-cpp.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/components/prism-bash.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/components/prism-json.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/components/prism-yaml.min.js"></script>
</head>
<body class="h-screen flex overflow-hidden">

    <!-- Global Sidebar -->
    <aside class="w-80 bg-[#070b14] border-r border-slate-800 flex-col h-full shadow-2xl z-20 flex-shrink-0 hidden lg:flex">
        <div class="p-6 border-b border-slate-800">
            <h1 class="text-2xl font-bold text-white tracking-tight">sUAS Edge AI<br><span class="text-sky-500 text-lg">Engineering Masterclass</span></h1>
            <p class="mt-3 text-xs text-slate-500 font-mono">17 Modules · ~40 hours</p>
        </div>
        <div class="flex-1 overflow-y-auto py-6 px-4">
            <div class="text-[10px] font-bold text-slate-500 uppercase tracking-widest mb-4 px-2">Curriculum</div>
            <ul class="space-y-1" id="nav-list"></ul>
        </div>
        <div class="p-5 border-t border-slate-800 bg-[#05080f]">
            <div class="flex justify-between items-center text-xs text-slate-500 font-mono mb-2">
                <span id="module-label">Select a module</span>
            </div>
            <div class="w-full bg-slate-800 h-1 rounded overflow-hidden">
                <div id="progress-bar" class="bg-sky-500 h-full w-0 transition-all duration-500"></div>
            </div>
        </div>
    </aside>

    <!-- Mobile Nav -->
    <div class="lg:hidden fixed top-0 left-0 right-0 bg-[#070b14] border-b border-slate-800 z-30 p-4 shadow-lg">
        <h1 class="text-lg font-bold text-white mb-2">sUAS Edge AI Masterclass</h1>
        <select id="mobile-nav" onchange="loadModule(this.value)" class="w-full bg-slate-800 text-white border border-slate-700 rounded p-2 text-sm focus:ring-2 focus:ring-sky-500 outline-none"></select>
    </div>

    <!-- Main Content -->
    <main class="flex-1 h-full overflow-y-auto bg-[#0a0f1a] pt-24 lg:pt-0 relative scroll-smooth" id="main-scroll">
        <div class="max-w-5xl mx-auto p-6 md:p-10 lg:p-16 xl:p-20" id="content-container"></div>
    </main>

    <script type="module" src="js/main.js"></script>
</body>
</html>
